<!doctype html>
<!--
  Live checkpoint-pole texture. client/cp_anim.lua opens this in a DUI and
  swaps it over spz_cp_gate in spz_checkpoint.ytd.
  Texture: 256 x 1024, four 64 px columns [pending | taken | start | finish],
  bottom of the image = bottom of the pole. The colour bands scroll UP the
  pole; the bottom fade (alpha) stays where it is.
-->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var SPEED = 160;          // px per second up the pole (texture is 1024 tall)
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var img = new Image();
  img.onload = function () {
    var W = img.width, H = img.height;
    cv.width = W; cv.height = H;
    // fade mask from the original alpha, so scrolling never moves the fade
    var mask = document.createElement('canvas'); mask.width = W; mask.height = H;
    var m = mask.getContext('2d'); m.drawImage(img, 0, 0);
    // opaque copy of the colours to scroll
    var solid = document.createElement('canvas'); solid.width = W; solid.height = H;
    var s = solid.getContext('2d');
    s.drawImage(img, 0, 0);
    s.globalCompositeOperation = 'destination-over'; s.fillStyle = '#000'; s.fillRect(0, 0, W, H);
    // the top band (bright) source region, repeated: use the upper 70% so the
    // faded bottom rows are never scrolled into view
    var top = Math.floor(H * 0.3), span = H - top;
    var t0 = performance.now();
    function frame(now) {
      var off = ((now - t0) / 1000 * SPEED) % span;
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, W, H);
      // tile the bright part of each column downward, moving up over time
      for (var y = -span + off; y < H; y += span) {
        ctx.drawImage(solid, 0, top, W, span, 0, H - (y + span), W, span);
      }
      // a soft light pulse travelling up
      var py = H - ((now - t0) / 1000 * SPEED * 1.6) % (H * 1.3);
      var g = ctx.createLinearGradient(0, py - 120, 0, py + 120);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.22)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // keep the original bottom fade
      ctx.globalCompositeOperation = 'destination-in';
      ctx.drawImage(mask, 0, 0);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  };
  img.src = 'spz_cp_gate.png';
})();
</script>
</body>
</html>
