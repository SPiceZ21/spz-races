<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPZ · Time Trial</title>
<link rel="stylesheet" href="spz-ui.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Panchang'; src: url('fonts/Panchang-Variable.ttf') format('truetype'); font-weight: 100 900; }
  html, body { background: transparent; font-family: var(--font-body); }
  #root { position: fixed; inset: 0; pointer-events: none; }

  /* ── HUD position (screen layout only — style via spz-hud-* classes) ── */
  .hud-box {
    position: fixed; bottom: 10vh; right: 3vw; width: 280px;
    pointer-events: auto;
    animation: spz-in 400ms var(--ease-out);
  }

  /* ── Lap history rows ────────────────────────────────────────── */
  .hud-laps { max-height: 120px; overflow-y: auto; border-top: 1px solid var(--border-muted); background: var(--bg-elevated); }
  .lap-row  { display: flex; align-items: center; padding: 6px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
  .lap-row[data-best="true"] { color: var(--color-success); background: rgba(41,211,152,0.05); }
  .lap-num { width: 30px; color: var(--text-faint); }

  /* ── Restart bar ─────────────────────────────────────────────── */
  .restart-bar { border-top: 1px solid var(--border-muted); padding: 8px 12px; cursor: pointer; transition: background var(--dur-base); position: relative; overflow: hidden; pointer-events: auto; }
  .restart-bar:hover { background: var(--bg-elevated); }
  .restart-progress { height: 2px; background: var(--color-primary); position: absolute; bottom: 0; left: 0; transition: width 100ms linear; }

  /* ── Track select menu ───────────────────────────────────────── */
  .menu-card { width: 560px; max-height: 80vh; display: flex; flex-direction: column; pointer-events: auto; }
  .filter-group { display: flex; background: rgba(255,255,255,0.05); border-radius: var(--radius-md); padding: 2px; }
  .track-row { display: flex; align-items: center; padding: 12px 16px; border-radius: var(--radius-md); cursor: pointer; transition: background var(--dur-base); margin-bottom: 2px; border: 1px solid transparent; }
  .track-row:hover { background: var(--bg-elevated); border-color: var(--border-muted); }
  .track-name { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--text-primary); flex: 1; }
  .track-meta { font-size: 11px; color: var(--text-muted); margin-left: 12px; width: 60px; }
  .track-empty { padding: 40px; text-align: center; color: var(--text-faint); }

  /* ── Results ─────────────────────────────────────────────────── */
  .results-card { width: 440px; pointer-events: auto; }
  .results-best-wrap { padding: 24px; text-align: center; border-bottom: 1px solid var(--border-muted); background: var(--bg-elevated); }
  .results-best-time { font-family: var(--font-display); font-weight: 800; font-size: 42px; color: var(--color-success); }
  .results-footer { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-muted); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/preact@latest/dist/preact.min.js"></script>
<script src="https://unpkg.com/preact@latest/hooks/dist/hooks.umd.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script type="text/babel" src="components/index.jsx"></script>

<script>
  window.onerror = function(msg, url, line, col, error) {
    console.log(`[TimeTrial UI ERROR] ${msg} at ${line}:${col} in ${url}`);
    if (error) console.log(error.stack);
    return false;
  };
</script>

<script type="text/babel">
/** @jsx h */
/** @jsxFrag Fragment */
const { h, render, Fragment } = preact;
const { useState, useEffect, useRef } = preactHooks;
const { Card, CardHeader, Button, Input, Badge, Kbd, Keycap, Prompt, Icon, StatItem, Separator } = window;

function App() {
  const [view, setView]             = useState('none');
  const [tracks, setTracks]         = useState([]);
  const [search, setSearch]         = useState('');
  const [filter, setFilter]         = useState('all');
  const [hudData, setHudData]       = useState({});
  const [timer, setTimer]           = useState('--:--.---');
  const [restart, setRestart]       = useState({ active: false, pct: 100, seconds: 3, key: 'BACK' });
  const [resultsData, setResultsData] = useState(null);

  useEffect(() => {
    const handler = (e) => {
      if (!e.data || !e.data.action) return;
      const { action, data = {} } = e.data;
      switch (action) {
        case 'tt_open_menu':    setTracks(data.tracks || []); setView('menu'); break;
        case 'tt_hud_show':     setHudData(data); setView('hud'); break;
        case 'tt_timer':        setTimer(data.formatted); break;
        case 'tt_lap_started':
          setHudData(prev => ({ ...prev, lap: data.lap, lapLabel: data.lapLabel, bestLap: data.bestLap }));
          setTimer('00:00.000');
          break;
        case 'tt_next_cp':
          setHudData(prev => ({ ...prev, cpIndex: data.cpIndex }));
          break;
        case 'tt_lap_complete':
          setHudData(prev => ({ ...prev, bestLap: data.bestLap, allLaps: data.allLaps }));
          break;
        case 'tt_end':          setResultsData(data); setView('results'); break;
        case 'tt_restart_start':
          setRestart(prev => ({ ...prev, active: true, pct: 100, seconds: 3 }));
          break;
        case 'tt_restart_tick':
          setRestart(prev => ({ ...prev, pct: (data.remaining / data.totalMs) * 100, seconds: data.seconds }));
          break;
        case 'tt_restart_cancel':
        case 'tt_restart_done':
          setRestart(prev => ({ ...prev, active: false, pct: 100 }));
          if (action === 'tt_restart_done') {
            setHudData(prev => ({ ...prev, lapLabel: data.lapLabel, bestLap: data.bestLap }));
            setTimer('--:--.---');
          }
          break;
        case 'tt_hide':         setView('none'); break;
      }
    };
    window.addEventListener('message', handler);
    return () => window.removeEventListener('message', handler);
  }, []);

  const filteredTracks = tracks.filter(t => {
    const typeOk = filter === 'all' || t.type === filter;
    const nameOk = !search || t.name.toLowerCase().includes(search.toLowerCase());
    return typeOk && nameOk;
  });

  const post = (action, data = {}) =>
    fetch(`https://${GetParentResourceName()}/${action}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    }).catch(() => {});

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape' && view === 'menu') { post('tt_closeMenu'); setView('none'); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [view]);

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  return (
    <>
      {/* ── Track Select Menu ─────────────────────────────────── */}
      {view === 'menu' && (
        <div className="spz-overlay">
          <Card className="menu-card spz-modal">
            <CardHeader title="Time Trial Session" desc="Select a track for a solo practice run. Unlimited laps.">
              <Button variant="ghost" size="icon" onClick={() => { post('tt_closeMenu'); setView('none'); }}>
                <Icon name="x" size={14} />
              </Button>
            </CardHeader>

            <div className="flex items-center gap-3" style={{ padding: '0 16px 12px' }}>
              <div className="filter-group">
                {['all', 'circuit', 'sprint'].map(f => (
                  <Button
                    key={f}
                    variant={filter === f ? 'primary' : 'ghost'}
                    size="sm"
                    onClick={() => setFilter(f)}
                    style={{ textTransform: 'capitalize' }}
                  >
                    {f}
                  </Button>
                ))}
              </div>
              <div className="flex-1" style={{ position: 'relative' }}>
                <Icon name="search" size={13} style={{ position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)' }} />
                <Input style={{ paddingLeft: 30 }} placeholder="Search tracks..." value={search} onChange={e => setSearch(e.target.value)} autoFocus />
              </div>
            </div>

            <div className="overflow-y-auto" style={{ flex: 1, padding: '6px 12px 12px' }}>
              {filteredTracks.length === 0
                ? <div className="track-empty">No tracks found</div>
                : filteredTracks.map(t => (
                  <div key={t.index} className="track-row" onClick={() => { post('tt_selectTrack', { index: t.index }); setView('none'); }}>
                    <span className="track-name">{t.name}</span>
                    <Badge variant={t.type === 'circuit' ? 'purple' : 'primary'}>{t.type}</Badge>
                    <span className="track-meta">{t.type === 'circuit' ? `${t.laps} LAPS` : 'POINT-B'}</span>
                    <Icon name="chevron-right" size={14} style={{ color: 'var(--text-faint)' }} />
                  </div>
                ))
              }
            </div>
          </Card>
        </div>
      )}

      {/* ── Live HUD ────────────────────────────────────────────── */}
      {view === 'hud' && (
        <div className="hud-box spz-hud-panel">
          <div className="spz-hud-header">
            <span className="spz-hud-header-text">{hudData.track || 'Track'}</span>
            <Badge variant="solid" style={{ height: 16, fontSize: 8 }}>{hudData.trackType || 'SOLO'}</Badge>
          </div>

          <div className="spz-hud-timer-wrap">
            <div className="spz-hud-timer-label">{hudData.lapLabel || 'SESSION'}</div>
            <div className="spz-hud-timer-val">{timer}</div>
          </div>

          <div className="spz-hud-stats-grid">
            <StatItem label="Best Lap" value={hudData.bestLap || '--:--.---'} variant="success" />
            <StatItem label="Checkpoint" value={`${hudData.cpIndex || 1} / ${hudData.cpTotal || '?'}`} />
          </div>

          {hudData.allLaps?.length > 0 && (
            <div className="hud-laps">
              {[...hudData.allLaps].reverse().map((l, i) => (
                <div key={i} className="lap-row" data-best={l.isBest}>
                  <span className="lap-num">L{l.lapNum}</span>
                  <span className="flex-1">{l.label}</span>
                  <span className="font-bold">{l.time}</span>
                </div>
              ))}
            </div>
          )}

          <div className="restart-bar" onClick={() => post('tt_restartBtn')}>
            {restart.active ? (
              <div className="flex justify-between items-center">
                <span className="spz-eyebrow primary">RESTARTING IN {restart.seconds}...</span>
                <div className="flex items-center gap-2">
                  <Kbd>{restart.key}</Kbd>
                  <span className="spz-stat-label">cancel</span>
                </div>
                <div className="restart-progress" style={{ width: `${restart.pct}%` }} />
              </div>
            ) : (
              <div className="flex items-center gap-2">
                <Icon name="rotate-ccw" size={12} style={{ color: 'var(--color-primary)' }} />
                <span style={{ fontSize: 11, color: 'var(--text-secondary)' }}>Hold to Restart Session</span>
                <Kbd style={{ marginLeft: 'auto' }}>{restart.key || 'BACK'}</Kbd>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── Session Results ──────────────────────────────────────── */}
      {view === 'results' && resultsData && (
        <div className="spz-overlay">
          <Card className="results-card spz-modal">
            <CardHeader title="Session Complete" desc={resultsData.track} />

            <div className="results-best-wrap">
              <div className="spz-eyebrow primary" style={{ marginBottom: 4 }}>Fastest Lap Time</div>
              <div className="results-best-time">{resultsData.bestLap || '--:--.---'}</div>
            </div>

            <div className="overflow-y-auto" style={{ maxHeight: 240 }}>
              {(resultsData.allLaps || []).map((l, i) => (
                <div key={i} className="lap-row" data-best={l.isBest} style={{ padding: '10px 24px' }}>
                  <span className="lap-num">#{l.lapNum}</span>
                  <span className="flex-1">{l.label}</span>
                  <span style={{ fontSize: 14, fontWeight: 700 }}>{l.time}</span>
                </div>
              ))}
            </div>

            <div className="results-footer">
              <span className="spz-stat-label">{resultsData.totalLaps} timed laps completed</span>
              <Button variant="primary" onClick={() => { post('tt_dismissResults'); setView('none'); }}>Dismiss</Button>
            </div>
          </Card>
        </div>
      )}
    </>
  );
}

render(<App />, document.getElementById('root'));
</script>
</body>
</html>
